<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>넘버 아일랜드 — 13단계 액션 수학 대모험</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>🏝️</text></svg>">
  <link rel="stylesheet" href="./stepmath/styles.css">
</head>
<body>
  <div id="arcadeWrap">
    <!-- 상단 아케이드 HUD -->
    <header id="hudBar">
      <div class="hud-left">
        <a id="homeLink" class="hud-btn" href="./index.html" title="학습 게임 목록">🏠 목록</a>
        <button type="button" class="hud-btn map-btn" id="btnMap">🗺️ 13개 섬</button>
        <div class="stage-stepper">
          <button type="button" class="step-arrow" id="btnPrevStage" aria-label="이전 섬">◀</button>
          <button type="button" class="stage-pill" id="btnStageInfo">
            <span id="hudStageIcon">🍎</span>
            <span id="hudStageName">1단계 과일 바운스</span>
          </button>
          <button type="button" class="step-arrow" id="btnNextStage" aria-label="다음 섬">▶</button>
        </div>
      </div>

      <div class="hud-center">
        <div class="wave-wrap" aria-label="웨이브 진행">
          <span class="wave-txt" id="hudWaveTxt">WAVE 1/3</span>
          <div class="wave-bar"><div class="wave-fill" id="hudWaveFill"></div></div>
        </div>
        <div class="hud-hearts" id="hudHearts" aria-label="남은 하트">❤️❤️❤️</div>
        <div class="hud-score">
          <span class="score-pill">⭐ <b id="hudScore">0</b></span>
          <span class="combo-pill" id="hudCombo" hidden>🔥 x1</span>
        </div>
      </div>

      <div class="hud-right">
        <button type="button" class="hud-btn toggle" id="btnSlow" title="속도를 천천히 해서 여유롭게 플레이해요">🐢 천천히 OFF</button>
        <button type="button" class="hud-btn toggle on" id="btnMusic" title="배경 음악 켜기/끄기">🎵 음악 ON</button>
        <button type="button" class="hud-btn toggle on" id="btnSfx" title="효과음 켜기/끄기">🔔 소리 ON</button>
        <button type="button" class="hud-btn toggle on" id="btnVoice" title="짧은 음성 응원 켜기/끄기">🗣️ 음성 ON</button>
        <button type="button" class="hud-btn" id="btnRestart" title="현재 단계 다시 시작">↻</button>
      </div>
    </header>

    <!-- 게임 캔버스 영역 -->
    <main id="stageWrap">
      <canvas id="gameCanvas"></canvas>

      <!-- 상단 미션 플로팅 배지 (간결한 아이콘 + 핵심 목표) -->
      <div id="missionChip" hidden>
        <span class="mission-tag" id="missionTag">ACTION</span>
        <span class="mission-text" id="missionText">과일을 바구니로 던지세요!</span>
      </div>

      <!-- 플로팅 메시지 -->
      <div id="floatBanner" hidden></div>

      <!-- 태블릿 터치 액션 패드 (점프/러너/이동형 스테이지에서 자동 노출) -->
      <div id="touchPad" hidden>
        <div class="pad-group left">
          <button type="button" class="pad-btn" id="padLeft" aria-label="왼쪽">◀</button>
          <button type="button" class="pad-btn" id="padRight" aria-label="오른쪽">▶</button>
        </div>
        <div class="pad-group right">
          <button type="button" class="pad-btn action" id="padAction" aria-label="점프 또는 액션">⬆️ 점프!</button>
        </div>
      </div>

      <!-- 월드맵 / 타이틀 오버레이 -->
      <section id="mapOverlay" class="overlay-screen">
        <div class="map-panel">
          <div class="map-hero">
            <div class="hero-badge">🎮 TABLET ACTION MATH</div>
            <h1>넘버 아일랜드 대모험!</h1>
            <p>피하고 · 던지고 · 점프하고 · 베고 · 합체하면서 변신하는 <b>13개 액션 수학 월드</b></p>
            <div class="hero-actions">
              <button type="button" class="big-play-btn" id="btnQuickPlay">▶ 이어서 모험하기</button>
              <span class="total-stars-pill" id="totalStarsPill">⭐ 0 / 39</span>
            </div>
          </div>
          <div class="world-grid" id="worldGrid"></div>
        </div>
      </section>

      <!-- 스테이지 클리어 / 결과 오버레이 -->
      <section id="resultOverlay" class="overlay-screen" hidden>
        <div class="result-card" id="resultCard">
          <div class="result-stars" id="resStars">⭐⭐⭐</div>
          <h2 id="resTitle">스테이지 클리어!</h2>
          <p id="resSub">멋진 액션으로 수 개념을 정복했어요!</p>
          <div class="res-stats" id="resStats"></div>
          <div class="res-actions">
            <button type="button" class="res-btn soft" id="btnResMap">🗺️ 섬 지도</button>
            <button type="button" class="res-btn warn" id="btnResRetry">↻ 다시 도전</button>
            <button type="button" class="res-btn primary" id="btnResNext">▶ 다음 섬으로!</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="./assets/d1_client.js"></script>
  <script src="./stepmath/audio.js"></script>
  <script src="./stepmath/engine.js"></script>
  <script src="./stepmath/stages_part1.js"></script>
  <script src="./stepmath/stages_part2.js"></script>
  <script src="./stepmath/main.js"></script>
</body>
</html>
