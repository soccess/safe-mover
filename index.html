<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학습 게임 모음</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif; background:#0b1620; color:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .wrap { max-width:960px; width:100%; text-align:center; }
  h1 { font-size:26px; margin-bottom:8px; }
  p.sub { color:#B0BEC5; font-size:14px; margin-bottom:24px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  @media (max-width:860px){ .grid { grid-template-columns:1fr 1fr; } }
  @media (max-width:560px){ .grid { grid-template-columns:1fr; } }
  .card { background:#fff; color:#222; border-radius:18px; padding:24px 20px; text-decoration:none; display:block; border:4px solid transparent; transition:transform .15s, border-color .15s; }
  .card:hover { transform:translateY(-4px); border-color:#FFD600; }
  .card .icon { font-size:52px; }
  .card h2 { font-size:18px; margin:10px 0 6px; color:#1565C0; }
  .card p { font-size:13px; color:#546E7A; line-height:1.5; }
  .card .go { display:inline-block; margin-top:12px; background:#00C853; color:#fff; font-weight:900; border-radius:10px; padding:10px 18px; font-size:14px; }
  .card.math h2 { color:#7C3AED; }
  .card.math .go { background:#7C3AED; }
  .card.emotion h2 { color:#5D4DA9; }
  .card.emotion .go { background:#7665C5; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎮 학습 게임 모음</h1>
  <p class="sub">원하는 게임을 선택하세요 (총 3개)</p>
  <div class="grid">
    <a class="card" href="./safe_mover_8_stages.html">
      <div class="icon">🛡️📦</div>
      <h2>허리 지킴이의 배송 대작전<br>12단계 모험 코스</h2>
      <p>좌/우 터치로 장애물을 피하고 별을 모으는<br>12스테이지 달리기 게임 (게임오버 없음)</p>
      <span class="go">▶ 게임 시작</span>
    </a>
    <a class="card math" href="./stepmath.html">
      <div class="icon">📐✏️</div>
      <h2>수학 공책<br>터치 구체물 활동</h2>
      <p>손가락으로 끌어 보는 12개 활동 ·<br>10·100 묶기 · 도형 · 특수교육 지원</p>
      <span class="go">▶ 학습 시작</span>
    </a>
    <a class="card emotion" href="./emotion.html">
      <div class="icon">🌤️💛</div>
      <h2>마음 날씨 연구소<br>감정표현하기</h2>
      <p>기쁨·슬픔·화남·놀람 감정 고르고<br>마음 돌보는 방법 배우기</p>
      <span class="go">▶ 마음 살펴보기</span>
    </a>
  </div>
</div>
</body>
</html>
