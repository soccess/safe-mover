<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>읽걷이의 맞춤법 모험 - 12단계 단어 잡기 게임</title>
  <link rel="stylesheet" href="./safe_mover/styles.css">
</head>
<body>
  <div id="wrap">
    <div id="topbar">
      <a id="homeLink" href="./index.html">🏠 목록</a>
      <div id="title">
        <!-- 귀여운 맞춤법 요정 연필 마스코트 아이콘 -->
        <svg class="title-svg" viewBox="0 0 36 36" width="24" height="24" aria-hidden="true">
          <circle cx="18" cy="21" r="11" fill="#FDE68A" stroke="#fff" stroke-width="2"/>
          <path d="M11 13h14l-3.5-8h-7z" fill="#FACC15" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
          <rect x="14.5" y="2" width="7" height="3.5" rx="1.7" fill="#F472B6"/>
          <circle cx="14.5" cy="20" r="1.6" fill="#1E293B"/>
          <circle cx="21.5" cy="20" r="1.6" fill="#1E293B"/>
          <circle cx="12.5" cy="22.5" r="1.6" fill="#FB7185" opacity="0.7"/>
          <circle cx="23.5" cy="22.5" r="1.6" fill="#FB7185" opacity="0.7"/>
          <path d="M15.5 24.5q2.5 2.5 5 0" fill="none" stroke="#B45309" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>읽걷이의 맞춤법 모험</span>
      </div>
      <div id="chips"></div>
      <button class="btn" id="btnReview" title="단계별 맞춤법 단어를 복습하고 퀴즈로 연습해요">📖 단어 복습</button>
      <button class="btn" id="btnPracticeMode" title="속도를 낮추고 방해 요소를 줄여 차분히 연습해요">🐢 천천히 OFF</button>
      <button class="btn" id="btnPause" title="잠시 멈추고 숨을 고릅니다">⏸️ 쉬기</button>
      <button class="btn" id="btnVoice" title="단어와 안내를 소리 내어 읽어줘요">🗣️ 음성 ON</button>
      <button class="btn" id="btnSound" title="효과음을 켜거나 꺼요">🔔 효과음 ON</button>
      <button class="btn" id="btnFullscreen" title="전체화면으로 보기">⛶ 전체화면</button>
      <button class="btn" id="btnRestart">↻ 처음부터</button>
    </div>
    <div id="banner">⭕ 글자 요정 읽걷이를 움직여 바른 맞춤법 단어를 잡고, ❌ 틀린 단어를 든 적은 피하세요!</div>
    <div id="progs">
      <div id="stageProgWrap">
        <span id="stageLabel">1단계 🌱</span>
        <span id="gimmickBadge" class="gimmick-badge">✨ 황금 첫걸음</span>
        <div class="barOuter"><div class="barInner" id="stageBar"></div></div>
        <span id="buffBadges" class="buff-badges"></span>
        <span id="stageStat">⭐ 0점 · ⭕ 0개 · 🛡️ 0회</span>
      </div>
      <div id="totalProgWrap">
        <span>🗺️ 전체 코스</span>
        <div class="barOuter"><div class="barInner" id="totalBar"></div></div>
        <span id="totalLabel">1 / 12</span>
      </div>
    </div>
    <div id="cvWrap">
      <canvas id="cv"></canvas>
      <div id="hint">⬅️➡️ 좌우 터치/스와이프로 움직여 바른 단어 잡기! · 🌀 워프·레일·반전 기믹 활용!</div>
      <button class="padBtn" id="padL">◀ 왼쪽</button>
      <button class="padBtn" id="padR">오른쪽 ▶</button>
      <div id="floatMsg"></div>
      <div id="overlay"><div id="card"></div></div>
      <div id="reviewModal" aria-hidden="true">
        <div id="reviewCard"></div>
      </div>
    </div>
  </div>

  <script src="./assets/d1_client.js"></script>
  <script src="./safe_mover/words.js"></script>
  <script src="./safe_mover/stages.js"></script>
  <script src="./safe_mover/audio.js"></script>
  <script src="./safe_mover/renderer.js"></script>
  <script src="./safe_mover/game.js"></script>
</body>
</html>
