/* ---------- 장면 합성 ---------- */
function sceneSVG(type,mood){
 const prop=(sceneProps[type]||sceneProps.breathe)();
 const extra={water:-10,music:-8,trophy:-8,draw:-6,write:-10}[type]||0;
 const propShift=-16+extra;
 const akid=kid(mood,type,type==='friend'?72:80,46,1.06);
 let front='';
 if(type==='read'){
  front=`<g transform="translate(80 88)"><path d="M-25-8q25-12 50 0v24q-25-11-50 0z" fill="#fffaf0" stroke="#8d7a62" stroke-width="1.8"/><path d="M0-8v24" stroke="#cbbba2" stroke-width="1.2"/><path d="M-18-2h13m-13 5h13m5-5h13m-13 5h13" stroke="#cdbfae" stroke-width="1.2" stroke-linecap="round"/><path d="M9 10q4-4 8 0q-4 4-8 0" fill="#f2a3a8"/></g>`;
 }else if(type==='draw'){
  front=`<g transform="translate(104 92) rotate(-24)"><path d="M0 0l17-4" stroke="#c98f3f" stroke-width="3.2" stroke-linecap="round"/><path d="M17-4q4-1 3 2" fill="#f2a3a8"/></g>`;
 }else if(type==='write'){
  front=`<g transform="translate(104 92) rotate(14)"><path d="M0 0l48-10" stroke="#f0bd57" stroke-width="4" stroke-linecap="round"/><path d="M44-9l8-2-4 6z" fill="#f4d9a6" stroke="#c99f63" stroke-width="1"/><path d="M0 2l6-2" stroke="#c98f3f" stroke-width="2.6" stroke-linecap="round"/></g>`;
 }else if(type==='friend'){
  front=`${kid(mood,'friend',132,46,1.02,true)}<g transform="translate(102 89)"><circle r="4.6" fill="#ffd9b8" stroke="#6b5a52" stroke-width="1.8"/></g>`;
 }else if(type==='jar'){
  front=`<g transform="translate(107 86) rotate(-12)"><rect x="0" y="-5" width="13" height="10" rx="1.5" fill="#fffdf2" stroke="#c9b79d" stroke-width="1.2"/><path d="M3-2h7M3 2h5" stroke="#d9c7a8" stroke-width="1.1"/></g><path d="M122 82q38-14 58-20" fill="none" stroke="#c9b6f2" stroke-width="1.4" stroke-dasharray="3 4" stroke-linecap="round"/>`;
 }else if(type==='water'){
  front=`<path d="M96 88q8-3 10 2" fill="none" stroke="#6b5a52" stroke-width="2"/>`;
 }
 return `<svg viewBox="0 0 240 140" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${(typeof sceneLabels!=='undefined'?sceneLabels[type]:'')||'마음 돌보기'} 장면 그림" xmlns="http://www.w3.org/2000/svg">
  ${bgScene(mood,type)}
  ${type==='friend'?prop:`<g transform="translate(${propShift} 0)">${prop}</g>`}
  ${akid}
  ${front}
  <g opacity=".55"><path d="M12 16q3-6 6 0q-3 5-6 0" fill="#fff"/><path d="M226 122q3-6 6 0q-3 5-6 0" fill="#fff"/></g>
 </svg>`;
}

const moodCards=document.getElementById('moodCards');Object.entries(moods).forEach(([key,m])=>{let card=document.createElement('button');card.className='mood-card';card.dataset.mood=key;card.setAttribute('aria-label',m.label+' 선택');card.innerHTML=`<div class="mood-picture">${faceSvg(key)}</div><div class="mood-label">${m.label}<span class="mood-arrow">↗</span></div><p class="mood-desc">${m.description}</p>`;card.onclick=()=>chooseMood(key);moodCards.append(card)});
let currentMood='';function chooseMood(key){currentMood=key;let m=moods[key];document.getElementById('homeStage').classList.remove('visible');document.getElementById('methodStage').classList.add('visible');let banner=document.getElementById('chosenBanner');banner.style.background=m.color;banner.innerHTML=`${faceSvg(key)}<div><h2>나는 지금 ${m.label}한 마음이에요</h2><p>${m.tagline} ${m.moodLine}</p></div><span class="badge">${m.face} ${m.label} 마음 날씨</span>`;let cards=document.getElementById('methodCards');cards.innerHTML='';document.getElementById('detail').className='detail';m.methods.forEach((item,i)=>{let [type,title,sub]=item;let b=document.createElement('button');b.className='method-card';b.style.setProperty('--wash',m.color);b.innerHTML=`<div class="method-art">${sceneSVG(type,key)}</div><div class="method-title">${title}</div><p class="method-sub">${sub}</p><div class="go">방법 살펴보기 →</div>`;b.onclick=()=>showDetail(item,i);cards.append(b)});document.getElementById('p1').className='dot done';document.getElementById('p2').className='dot active';document.getElementById('p3').className='dot';window.scrollTo({top:0,behavior:'smooth'})}
function showDetail(item,index){let [type,title,sub,tip]=item,m=moods[currentMood];let actions={breathe:['편안한 자세로 앉거나 서서 발바닥을 바닥에 느껴요.','코로 하나, 둘, 셋 천천히 숨을 들이쉬어요.','입으로 하나, 둘, 셋, 넷 길게 내쉬어요.','마음이 조금 편안해질 때까지 반복해요.'],music:['내가 좋아하거나 편안하게 느끼는 노래를 골라요.','소리가 잘 들리는 편안한 자리에 앉아요.','노래의 악기나 리듬에 귀를 기울여요.','몸의 힘이 빠지는 느낌을 천천히 살펴봐요.'],walk:['선생님이나 보호자에게 산책하고 싶다고 알려요.','안전한 길에서 천천히 발걸음을 옮겨요.','바람, 나뭇잎, 하늘 중 하나를 찾아봐요.','돌아와서 몸과 마음이 어떻게 달라졌는지 느껴요.'],read:['지금 읽고 싶은 책 한 권을 골라요.','편안한 자리를 찾아 천천히 책장을 넘겨요.','마음에 남는 문장이나 그림을 찾아봐요.','다 읽지 않아도 괜찮아요. 잠시 쉬어도 좋아요.'],water:['물컵을 준비해 천천히 한 모금 마셔요.','물이 입안에 닿는 느낌을 알아차려요.','목을 지나가는 시원한 느낌을 느껴봐요.','잠깐 멈추고 몸이 보내는 신호를 살펴요.'],talk:['이야기하고 싶은 믿을 수 있는 어른을 떠올려요.','“지금 나는 ___한 기분이에요”라고 시작해요.','무슨 일이 있었는지 천천히 말해요.','말하기 어려우면 그림이나 쪽지로 전해도 돼요.'],draw:['종이와 색연필을 준비해요.','지금 마음과 닮은 색을 하나 골라요.','선, 모양, 그림으로 마음을 표현해요.','그림에 제목을 붙이거나 설명해봐요.'],cozy:['조용하고 편안한 자리를 찾아요.','담요나 인형을 안고 몸을 포근하게 해요.','어깨에 힘을 빼고 천천히 숨 쉬어요.','“나는 소중해. 조금씩 괜찮아질 거야”라고 말해요.'],friend:['기쁜 일을 함께 나누고 싶은 친구를 떠올려요.','“오늘 기분 좋은 일이 있었어!”라고 이야기해요.','친구의 기쁨도 함께 들어줘요.','함께 웃으며 좋은 순간을 기억해요.'],jar:['작은 종이나 마음 항아리를 준비해요.','오늘 고마웠던 일을 하나 떠올려요.','고마운 일을 적거나 그림으로 그려 넣어요.','마음이 힘든 날 항아리를 열어 읽어봐요.'],dance:['좋아하는 노래를 골라 안전한 공간을 만들어요.','음악을 틀고 편한 만큼 몸을 움직여요.','춤추면서 내 몸이 보내는 느낌을 살펴봐요.','즐거운 마음을 충분히 느껴봐요.'],trophy:['오늘 내가 해낸 작은 일을 떠올려요.','그 일을 해내기 위해 노력한 점을 찾아봐요.','스스로에게 “참 잘했어!”라고 말해줘요.','작은 축하 표시를 하거나 누군가와 나눠요.'],question:['무슨 일이 있었는지 내가 아는 것을 정리해요.','궁금한 점을 한 가지 골라요.','믿을 수 있는 어른에게 차분히 물어봐요.','설명을 들은 뒤 더 궁금한 것도 물어봐도 돼요.'],write:['종이나 메모장을 준비해요.','무슨 일이 있었는지 기억나는 대로 적어요.','사실과 내 느낌을 나눠 써봐요.','도움이 필요하면 쓴 내용을 어른과 함께 읽어요.']};let steps=actions[type]||actions.talk;let detail=document.getElementById('detail');detail.style.gridTemplateColumns='';detail.innerHTML=`<div class="detail-art">${sceneSVG(type,currentMood,true)}</div><div class="detail-copy"><div class="detail-kicker">${m.face} ${m.label}한 마음 돌보기 · 방법 ${index+1}</div><h3>${title}</h3><p class="intro">${sub}</p><ol class="steps">${steps.map((s,i)=>`<li><span class="step-no">${i+1}</span><span>${s}</span></li>`).join('')}</ol><div class="say-box">💬 ${tip}</div><div id="donePanel" class="done-panel">🌷 잘했어요! 내 마음을 돌보는 멋진 연습을 했어요.</div><div class="detail-actions"><button class="action primary" onclick="markDone()">이 방법 해봤어요 ✓</button><button class="action secondary" onclick="closeDetail()">다른 방법 보기</button></div></div>`;detail.classList.add('open');document.getElementById('p3').className='dot active';setTimeout(()=>detail.scrollIntoView({behavior:'smooth',block:'start'}),50)}
function markDone(){document.getElementById('donePanel').classList.add('show');document.getElementById('p3').className='dot done'}function closeDetail(){document.getElementById('detail').className='detail';document.getElementById('p3').className='dot';document.getElementById('methodCards').scrollIntoView({behavior:'smooth',block:'start'})}function goHome(){document.getElementById('methodStage').classList.remove('visible');document.getElementById('homeStage').classList.add('visible');document.getElementById('p1').className='dot active';document.getElementById('p2').className='dot';document.getElementById('p3').className='dot';window.scrollTo({top:0,behavior:'smooth'})}
</script>
