<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>우리 도서관 - 3D 사서 직무 실습</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Jua&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5eee2;
      --surface: rgba(255, 255, 255, 0.9);
      --surface-solid: #ffffff;
      --surface-soft: rgba(244, 236, 224, 0.94);
      --text: #2a2118;
      --text-muted: #695a4c;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --green: #15803d;
      --accent: #d97706;
      --border: rgba(196, 174, 146, 0.85);
      --shadow: 0 8px 24px rgba(58, 40, 20, 0.14);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      user-select: none;
    }

    #app {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .stage-wrap {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    .canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }
    .canvas-container:active { cursor: grabbing; }

    /* 상단 최소 HUD */
    .hud-top {
      position: absolute;
      top: max(6px, env(safe-area-inset-top));
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 0 8px;
      pointer-events: none;
      z-index: 15;
    }
    .hud-top > * { pointer-events: auto; }

    .top-bar {
      width: 100%;
      max-width: 1080px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 12px;
      background: linear-gradient(135deg, rgba(255, 253, 249, 0.94), rgba(250, 242, 229, 0.92));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 2px solid rgba(206, 186, 158, 0.95);
      border-radius: 16px;
      box-shadow: 0 4px 0 rgba(176, 148, 114, 0.35), 0 12px 26px rgba(68, 46, 26, 0.14);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }
    .brand-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .task-picker-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      border: 2px solid var(--border);
      background: var(--surface-solid);
      color: var(--text);
      font-family: "Jua", "Fredoka", "Pretendard", "Malgun Gothic", sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 3px 0 rgba(180, 155, 128, 0.5);
    }
    .task-picker-btn:hover { background: #f6efe4; }
    .task-picker-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(180, 155, 128, 0.5); }
    .picker-caret { font-size: 11px; color: var(--text-muted); }

    .score-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      color: #1e40af;
      background: #dbeafe;
      padding: 3px 9px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pill-btn {
      border: 2px solid var(--border);
      background: var(--surface-solid);
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
      padding: 5px 9px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 3px 0 rgba(180, 155, 128, 0.5);
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }
    .pill-btn:active { transform: translateY(2px) scale(0.97); box-shadow: 0 1px 0 rgba(180, 155, 128, 0.5); }
    .pill-btn.active {
      background: #dbeafe;
      border-color: var(--primary);
      color: var(--primary-hover);
      box-shadow: 0 3px 0 #1e40af;
    }
    .home-pill-link {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* 3가지 연습 모드 전환 바 */
    .pmode-switch {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 2px;
      border-radius: 999px;
      background: #ebe1d0;
      border: 1.5px solid var(--border);
    }
    .pmode-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s, box-shadow 0.15s;
    }
    .pmode-btn:hover { color: var(--text); }
    .pmode-btn.active {
      background: var(--green);
      color: #fff;
      box-shadow: 0 2px 0 #14532d;
    }
    .pmode-btn[data-pmode="manual"].active {
      background: #0284c7;
      box-shadow: 0 2px 0 #075985;
    }
    .pmode-btn[data-pmode="practicum"].active {
      background: #d97706;
      box-shadow: 0 2px 0 #92400e;
    }

    /* 작업 선택 드로어 */
    .task-drawer {
      width: 100%;
      max-width: 760px;
      max-height: 62vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(14px);
      border: 2px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      z-index: 26;
    }
    .task-drawer-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-muted);
      padding: 0 2px;
    }
    .task-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 8px;
    }
    .task-card-btn {
      border: 2px solid var(--border);
      background: var(--surface-soft);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 13px;
      cursor: pointer;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 3px;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .task-card-btn:hover { background: #ebe0cf; transform: translateY(-1px); }
    .task-card-btn.active {
      background: #1d4ed8;
      border-color: #1e40af;
      color: #ffffff;
    }
    .task-card-btn strong { font-size: 13.5px; }
    .task-card-btn small { font-size: 11.5px; opacity: 0.86; line-height: 1.35; }

    /* 설정 팝오버 */
    .settings-popover {
      position: absolute;
      top: calc(max(6px, env(safe-area-inset-top)) + 52px);
      right: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(14px);
      border: 2px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      z-index: 26;
    }

    /* 과제 분석표 */
    .schedule-strip {
      width: 100%;
      max-width: 1080px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 7px;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(8px);
      border: 1.5px solid var(--border);
      border-radius: 11px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .schedule-strip::-webkit-scrollbar { display: none; }

    .step-card {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 800;
      white-space: nowrap;
    }
    .step-card .step-num {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: var(--border);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10.5px;
      font-weight: 900;
    }
    .step-card.current { border-color: var(--accent); background: #fff7ed; color: var(--text); }
    .step-card.current .step-num { background: var(--accent); color: #fff; }
    .step-card.done { border-color: var(--green); background: #ecfdf5; color: var(--green); }
    .step-card.done .step-num { background: var(--green); color: #fff; }
    .step-arrow { flex: 0 0 auto; color: var(--text-muted); font-weight: 800; font-size: 11px; }

    /* 지금 -> 다음 + 현재 도서 청구기호 요약 바 */
    .sub-hud-row {
      width: 100%;
      max-width: 1080px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .first-then-bar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      flex-wrap: wrap;
      padding: 5px 10px;
      background: rgba(255, 255, 255, 0.9);
      border: 1.5px solid var(--border);
      border-radius: 11px;
      font-size: 12px;
      font-weight: 800;
      color: var(--text);
    }
    .ft-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .ft-pill.now { background: #fff3e0; color: #9c4f0a; border: 1px solid #f5b971; }
    .ft-pill.next { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }

    .book-info-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 11px;
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #2563eb;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.14);
      font-size: 12.5px;
      font-weight: 800;
      color: #0f172a;
    }
    .book-kdc-band {
      display: inline-block;
      width: 10px;
      height: 18px;
      border-radius: 4px;
      background: #2563eb;
    }
    .book-call-badge {
      background: #eff6ff;
      border: 1.5px solid #93c5fd;
      color: #1d4ed8;
      padding: 2px 8px;
      border-radius: 8px;
      font-weight: 900;
      letter-spacing: 0.3px;
    }

    /* 하단 플로팅 도크 */
    .action-dock {
      position: absolute;
      bottom: max(14px, calc(env(safe-area-inset-bottom) + 10px));
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 0 8px;
      pointer-events: none;
      z-index: 15;
    }

    .guidance-banner {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px 10px 16px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid var(--primary);
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(44, 36, 30, 0.16);
      font-size: clamp(15px, 2vw, 18.5px);
      line-height: 1.4;
      font-weight: 800;
      color: var(--text);
      max-width: min(840px, 96%);
      text-align: left;
    }
    .guidance-banner.gentle-hint {
      border-color: var(--accent);
      background: rgba(255, 248, 238, 0.97);
    }
    .guidance-banner.mistake-hint {
      border-color: #dc2626;
      background: rgba(254, 242, 242, 0.97);
      color: #991b1b;
    }
    .guidance-emoji { font-size: 22px; flex-shrink: 0; line-height: 1; }
    .guidance-text { flex: 1 1 auto; min-width: 0; word-break: keep-all; }
    .guidance-actions { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; }

    .guidance-ctrl-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 38px;
      min-height: 38px;
      padding: 0 9px;
      border-radius: 11px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }
    .guidance-ctrl-btn.speak { border: 1.5px solid var(--primary); background: #eff6ff; color: var(--primary); }
    .guidance-ctrl-btn.close { border: 1.5px solid #cbd5e1; background: #f8fafc; color: #475569; }

    .guidance-reopen-btn {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1.5px solid var(--primary);
      background: rgba(255, 255, 255, 0.95);
      color: var(--primary);
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(44, 36, 30, 0.14);
    }

    /* 수동실습 / 라벨 고르기 바 */
    .manual-choice-bar {
      pointer-events: auto;
      width: 100%;
      max-width: 800px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border: 2px solid #0284c7;
      border-radius: 16px;
      padding: 8px 12px;
      box-shadow: 0 8px 24px rgba(2, 132, 199, 0.22);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }
    .manual-choice-title { font-size: 12.5px; font-weight: 800; color: #0369a1; text-align: center; }
    .manual-choice-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; }
    .manual-choice-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 2px solid #bae6fd;
      background: #f0f9ff;
      color: #0c4a6e;
      font-size: 13px;
      font-weight: 800;
      padding: 8px 14px;
      border-radius: 12px;
      cursor: pointer;
      min-height: 42px;
      transition: transform 0.12s, background 0.15s, border-color 0.15s;
    }
    .manual-choice-btn:hover { background: #e0f2fe; border-color: #0284c7; transform: translateY(-1px); }
    .manual-choice-btn.wrong-shake {
      background: #fef2f2;
      border-color: #f87171;
      color: #991b1b;
      animation: lbShake 0.32s ease;
    }

    /* 실습모드 상태 바 */
    .practicum-status-bar {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      padding: 5px 10px;
      background: rgba(255, 251, 235, 0.95);
      border: 1.5px solid #f59e0b;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 800;
      color: #78350f;
      box-shadow: 0 4px 14px rgba(217, 119, 6, 0.16);
    }
    .prac-pill { background: #fff; border: 1px solid #fde68a; padding: 2px 8px; border-radius: 999px; }
    .prac-pill.warn { background: #fef2f2; border-color: #fca5a5; color: #b91c1c; }
    .prac-reset-btn {
      border: 1.5px solid #d97706;
      background: #fef3c7;
      color: #92400e;
      font-size: 12px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 999px;
      cursor: pointer;
    }

    /* 하단 동작 버튼 도크 */
    .action-bar {
      pointer-events: auto;
      max-width: 100%;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 9px;
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .action-bar::-webkit-scrollbar { display: none; }

    .tool-btn {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 46px;
      padding: 8px 14px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: var(--surface-soft);
      color: var(--text);
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 4px 0 rgba(168, 139, 115, 0.5), 0 6px 14px rgba(44, 36, 30, 0.08);
      transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
    }
    .tool-btn:hover:not(:disabled) { transform: translateY(-2px); background: #eae0d0; }
    .tool-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 rgba(168, 139, 115, 0.5); }
    .tool-btn.highlighted {
      border-color: #ea8c2a;
      background: linear-gradient(135deg, #fff7ea, #ffebd2);
      box-shadow: 0 0 0 3px rgba(217, 130, 43, 0.28), 0 6px 16px rgba(217, 130, 43, 0.22);
      animation: lbHighlightPulse 1.7s ease-in-out infinite;
    }
    .tool-btn.done-btn {
      background: #ecfdf5;
      border-color: #86efac;
      color: #166534;
    }
    .tool-btn:disabled { opacity: 0.48; cursor: not-allowed; }

    /* 3D 호버 툴팁 */
    .hover-label {
      position: absolute;
      padding: 5px 10px;
      background: rgba(30, 41, 59, 0.92);
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 700;
      border-radius: 8px;
      pointer-events: none;
      transform: translate(-50%, -130%);
      white-space: nowrap;
      z-index: 20;
    }

    .hidden { display: none !important; }

    /* 모달 */
    .complete-modal {
      position: absolute;
      inset: 0;
      background: rgba(30, 24, 18, 0.38);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
    }
    .complete-card {
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      border: 3.5px solid var(--primary);
      border-radius: 26px;
      padding: 26px 30px;
      text-align: center;
      box-shadow: 0 8px 0 #1e40af, 0 24px 56px rgba(0, 0, 0, 0.28);
      max-width: 430px;
      width: 90%;
      animation: lbModalPop 0.38s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
    }
    .complete-emoji { font-size: 40px; margin-bottom: 6px; }
    .complete-card h2 {
      margin: 0 0 8px;
      font-family: "Jua", "Fredoka", "Pretendard", sans-serif;
      font-size: 22px;
    }
    .complete-card p { margin: 0 0 18px; font-size: 15px; color: var(--text-muted); line-height: 1.5; font-weight: 700; }
    .complete-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

    .primary-action-btn {
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-family: "Jua", "Pretendard", sans-serif;
      font-size: 16.5px;
      font-weight: 800;
      padding: 12px 22px;
      cursor: pointer;
      box-shadow: 0 4px 0 #1e3a8a, 0 8px 18px rgba(29, 78, 216, 0.28);
    }
    .primary-action-btn:hover { background: var(--primary-hover); }
    .primary-action-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #1e3a8a; }

    .secondary-action-btn {
      background: #fffbeb;
      color: #b45309;
      border: 2px solid #f59e0b;
      border-radius: 14px;
      padding: 11px 18px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
    .secondary-action-btn:hover { background: #fef3c7; }

    .practicum-report {
      text-align: left;
      background: #fffbeb;
      border: 1.5px solid #fde68a;
      border-radius: 14px;
      padding: 11px 13px;
      margin-bottom: 16px;
      max-height: 210px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.5;
    }
    .prac-stars { text-align: center; font-size: 24px; margin-bottom: 6px; }
    .prac-item { padding: 4px 0; border-bottom: 1px dashed #fde68a; }
    .prac-item:last-child { border-bottom: none; }
    .prac-item.ok { color: #166534; }
    .prac-item.warn { color: #b91c1c; font-weight: 700; }

    @keyframes lbModalPop {
      from { opacity: 0; transform: scale(0.9) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes lbHighlightPulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(217, 130, 43, 0.24); }

    ];

    function strHash(s) {
      let h = 2166136261;
      for (let i = 0; i < s.length; i++) {
        h ^= s.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return Math.abs(h);
    }

    function getChosung(ch) {
      if (!ch) return 'ㅇ';
      const code = ch.charCodeAt(0);
      if (code >= 0xAC00 && code <= 0xD7A3) return CHOSUNG_SIMPLE[Math.floor((code - 0xAC00) / 588)] || 'ㅇ';
      return 'ㅇ';
    }

    function generateAuthorCode(author, title) {
      const a = String(author || '김작가').trim();
      const t = String(title || '도서').trim();
      const surname = a.charAt(0) || '김';
      let num = 54;
      if (a.length >= 2) {
        const u = a.charCodeAt(1);
        if (u >= 0xAC00 && u <= 0xD7A3) num = 11 + Math.floor(((u - 0xAC00) % 588) / 7);
        else num = 11 + (u % 88);
      } else {
        num = 15 + (strHash(a) % 75);
      }
      num = Math.max(11, Math.min(99, num));
      return surname + num + getChosung(t.charAt(0));
    }

    function formatKdc(val, diff) {
      if (diff === 1) return String(Math.round(val)).padStart(3, '0');
      const r = Math.round(val * 10) / 10;
      const ip = Math.floor(r);
      const fp = Math.round((r - ip) * 10);
      return fp === 0 ? String(ip).padStart(3, '0') : String(ip).padStart(3, '0') + '.' + fp;
    }

    function kdcBandColor(group) {
      const g = Math.floor((group || 800) / 100) * 100;
      const map = {
        0: '#64748b', 100: '#8b5cf6', 200: '#db2777', 300: '#ea580c', 400: '#16a34a',
        500: '#0891b2', 600: '#ca8a04', 700: '#65a30d', 800: '#2563eb', 900: '#9a3412'
      };
      return map[g] || '#2563eb';
    }

    function enrichBook(raw, diff = 2, colorIndex = -1) {
      const title = String(raw.title || '도서관 책').trim();
      const authorName = String(raw.author || '홍길동').trim();
      const h = strHash(title + authorName);
      let kdcVal = Number(raw.kdc || 813.6);
      kdcVal = Math.round(kdcVal * 10) / 10;
      const authorFull = generateAuthorCode(authorName, title);
      const author = diff === 1 ? authorFull.slice(0, 1) : authorFull;
      const value = diff === 1 ? Math.round(kdcVal) : kdcVal;
      const text = formatKdc(value, diff);
      const kdcGroup = Math.floor(kdcVal / 100) * 100;
      const color = colorIndex >= 0
        ? BOOK_COLORS[colorIndex % BOOK_COLORS.length]
        : BOOK_COLORS[h % BOOK_COLORS.length];
      return {
        title,
        authorName,
        author,
        value,
        text,
        callNo: `${text} ${author}`,
        barcode: raw.isbn || ('97889' + String(h % 100000000).padStart(8, '0')),
        category: raw.category || '한국문학',
        kdcGroup,
        color
      };
    }

    function cmpCall(a, b) {
      if (Math.abs(a.value - b.value) > 0.001) return a.value - b.value;
      return String(a.author || '').localeCompare(String(b.author || ''), 'ko');
    }

    function pickDistinctBooks(count, diff) {
      const pool = SEED_BOOKS.slice().sort(() => Math.random() - 0.5);
      const picked = [];
      const seenKeys = new Set();
      for (const raw of pool) {
        const eb = enrichBook(raw, diff, picked.length);
        const key = `${eb.text}_${eb.author}`;
        if (seenKeys.has(key)) continue;
        seenKeys.add(key);
        picked.push(eb);
        if (picked.length >= count) break;
      }
      return picked;
    }

      if (!state.soundEnabled) return null;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
      } catch { return null; }
    }
    function playTone(freq = 523.25, dur = 0.14, type = 'sine', vol = 0.06, delay = 0) {
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        const t = ctx.currentTime + delay;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(vol, t + 0.014);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t);
        osc.stop(t + dur + 0.03);
      } catch {}
    }

    function tweenTransform(obj, toPos, toRot, duration = 380, onDone = null) {
      const fromPos = obj.position.clone();
      const fromRot = new THREE.Euler(obj.rotation.x, obj.rotation.y, obj.rotation.z);
      const start = performance.now();
      animators.push({
        update(now) {
          const t = Math.min((now - start) / duration, 1);
          const k = 1 - Math.pow(1 - t, 3);
          if (toPos) {
            obj.position.lerpVectors(fromPos, toPos, k);
            obj.position.y += Math.sin(t * Math.PI) * 0.08;
          }
          if (toRot) {
            obj.rotation.x = THREE.MathUtils.lerp(fromRot.x, toRot.x, k);
            obj.rotation.y = THREE.MathUtils.lerp(fromRot.y, toRot.y, k);
            obj.rotation.z = THREE.MathUtils.lerp(fromRot.z, toRot.z, k);
          }
          if (t >= 1) {
            if (toPos) obj.position.copy(toPos);
            if (toRot) obj.rotation.set(toRot.x, toRot.y, toRot.z);
            if (onDone) onDone();
            return true;
          }
          return false;
        }
      });
    }

    // ---- [작업 2] 청구기호 순서대로 나열하기 3D 씬 ----
    function buildSortScene() {
      setWallSign('🔢 청구기호 배열 연습대 · 작은 번호부터 순서대로 나열하기', '#0f766e');
      const count = state.difficulty === 1 ? 3 : (state.difficulty === 3 ? 5 : 4);
      const books = pickDistinctBooks(count, state.difficulty);
      const sorted = books.slice().sort(cmpCall);
      // 시작 시 정렬되지 않도록 섞기 (이미 정렬된 경우 한 번 더 섞음)
      let shuffled = books.slice().sort(() => Math.random() - 0.5);
      if (shuffled.every((b, i) => b.callNo === sorted[i].callNo) && shuffled.length > 1) {
        [shuffled[0], shuffled[1]] = [shuffled[1], shuffled[0]];
      }

      const mult = getAspectMult();
      cameraPresets = {
        overview: { pos: new THREE.Vector3(0, 1.9 * mult, 2.25 * mult), target: new THREE.Vector3(0, DESK_Y + 0.18, 0) }
      };

      const spacing = count >= 5 ? 0.42 : 0.48;
      const slotX = (idx) => (idx - (count - 1) / 2) * spacing;

      // 뒤쪽: 정렬 레일 & 슬롯 (1번 ~ N번)
      const rail = new THREE.Mesh(
        new THREE.BoxGeometry(count * spacing + 0.24, 0.04, 0.34),
        new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.7 })
      );
      rail.position.set(0, DESK_Y + 0.02, -0.26);
      rail.receiveShadow = true;
      taskGroup.add(rail);

      const slots = [];
      for (let i = 0; i < count; i++) {
        const sx = slotX(i);
        const pad = new THREE.Mesh(
          new THREE.BoxGeometry(0.24, 0.015, 0.24),
          new THREE.MeshStandardMaterial({ color: 0xfef3c7, roughness: 0.6 })
        );
        pad.position.set(sx, DESK_Y + 0.048, -0.26);
        taskGroup.add(pad);

        const numSign = makeSignPlate(`${i + 1}번 자리`, '#0f766e', 0.24, 0.085);
        numSign.position.set(sx, DESK_Y + 0.06, -0.44);
        taskGroup.add(numSign);

        const slotAnchor = new THREE.Vector3(sx, DESK_Y + 0.06, -0.26);
        registerHit(pad, `slot_${i}`, `📥 ${i + 1}번 자리`, slotAnchor);
        slots.push({ index: i, x: sx, pad, placedBookIdx: null });
      }

      // 앞쪽: 대기 중인 3D 책들 (책등이 정면(카메라)을 향하게 세워 청구기호가 크게 보이게!)
      const trayBooks = shuffled.map((b, i) => {
        const bm = createBookMesh(b, { showLabel: true, showBarcode: false, scale: 1.22 });
        const bx = slotX(i);
        const homePos = new THREE.Vector3(bx, DESK_Y + 0.19, 0.28);
        bm.position.copy(homePos);
        // createBookMesh는 +x가 책등이므로 -PI/2 회전 시 +x가 +z(카메라)를 향함!
        bm.rotation.set(0, -Math.PI / 2, 0);
        taskGroup.add(bm);

        const targetId = `sort_book_${i}`;
        const camP = {
          pos: new THREE.Vector3(bx * 0.4, 1.65 * mult, 1.75 * mult),
          target: new THREE.Vector3(bx * 0.4, DESK_Y + 0.16, 0.02)
        };
        registerHit(bm, targetId, `📘 『${b.title}』 (${b.callNo})`, new THREE.Vector3(bx, DESK_Y + 0.04, 0.28), camP);
        return { idx: i, data: b, mesh: bm, homePos, placedSlot: -1 };
      });

      // 작업 단계 동적 구성
      TASKS.sort.steps = sorted.map((b, i) => ({
        target: `sort_step_${i}`,
        expectedCallNo: b.callNo,
        expectedTitle: b.title,
        emoji: '📘',
        label: `${i + 1}번 자리 놓기`,
        easyLabel: `${i + 1}번 책 놓기`,
        prompt: `${i + 1}번 자리에 올 가장 작은 청구기호 책을 골라 놓아요!`
      }));

      state.activeBook = sorted[0];
      state.roundData = { count, sorted, trayBooks, slots, nextSlot: 0 };
      sceneObjects = { trayBooks, slots };
    }

    // ---- [작업 3] 책을 청구기호에 따라 서가에 꽂기 3D 씬 ----

      registerHit(cartBook, 'pick_cart', `🛒 『${targetBook.title}』 (${targetBook.callNo}) 집기`, new THREE.Vector3(0, DESK_Y + 0.07, 0.32));

      state.activeBook = targetBook;
      state.roundData = {
        shelfBooks,
        targetBook,
        insertIndex,
        holdingBook: false,
        shelved: false,
        gapMeshes,
        slotX
      };
      sceneObjects = { cartBook, gapMeshes };
