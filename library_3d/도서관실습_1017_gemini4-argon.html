    // =========================================================================
    // 7. 3가지 모드(자동실습 / 수동실습 / 실습모드) 핵심 엔진
    // =========================================================================
    function getCurrentTask() { return TASKS[state.taskId]; }
    function getCurrentStep() { return getCurrentTask().steps[state.stepIndex] || null; }

    function getStepDisplay(step) {
      if (!step) return { label: '', prompt: '' };
      return {
        label: (state.easyMode && step.easyLabel) ? step.easyLabel : step.label,
        prompt: step.prompt
      };
    }

    function showGuidance(text, emoji = '📖', isGentle = false, isMistake = false) {
      const banner = document.getElementById('guidanceBanner');
      document.getElementById('guidanceEmoji').textContent = emoji;
      document.getElementById('guidanceText').textContent = text;
      banner.classList.toggle('gentle-hint', Boolean(isGentle));
      banner.classList.toggle('mistake-hint', Boolean(isMistake));
    }

    function updateBookInfoChip() {
      const chip = document.getElementById('bookInfoChip');
      const b = state.activeBook;
      if (!b) { chip.classList.add('hidden'); return; }
      chip.classList.remove('hidden');
      document.getElementById('chipKdcBand').style.background = kdcBandColor(b.kdcGroup);
      document.getElementById('chipBookTitle').textContent = `『${b.title}』 · ${b.authorName} (${b.category})`;
      const callEl = document.getElementById('chipCallNum');
      if (state.taskId === 'label' && state.practiceMode === 'practicum' && !state.roundData.labelDone) {
        callEl.textContent = '청구기호 라벨을 맞춰보세요!';
      } else {
        callEl.textContent = b.callNo;
      }
    }

    function getHighlightedTargetId() {
      const step = getCurrentStep();
      if (!step) return null;
      if (state.taskId === 'sort') {
        const rd = state.roundData;
        const idx = rd.trayBooks.findIndex((tb) => tb.placedSlot === -1 && tb.data.callNo === step.expectedCallNo);
        return idx >= 0 ? `sort_book_${idx}` : null;
      }
      if (state.taskId === 'shelve' && step.target === 'shelve_gap') {
        return `gap_${state.roundData.insertIndex}`;
      }
      return step.target;
    }

    function buildManualChoicesForStep(nextIdx) {
      const task = getCurrentTask();
      const nextStep = task.steps[nextIdx];
      if (!nextStep) return [];

      if (state.taskId === 'sort') {
        const remaining = state.roundData.trayBooks.filter((tb) => tb.placedSlot === -1);
        return remaining.map((tb) => ({
          id: `sort_book_${tb.idx}`,
          emoji: '📘',
          label: `${tb.data.callNo} (${tb.data.title})`,
          isCorrect: tb.data.callNo === nextStep.expectedCallNo
        }));
      }

      if (state.taskId === 'shelve' && nextStep.target === 'shelve_gap') {
        const { shelfBooks, insertIndex } = state.roundData;
        const choices = [];
        for (let g = 0; g <= shelfBooks.length; g++) {
          let label = '';
          if (g === 0) label = `1번 (『${shelfBooks[0].title}』 ${shelfBooks[0].callNo} 앞)`;
          else if (g === shelfBooks.length) label = `${g + 1}번 (『${shelfBooks[g - 1].title}』 ${shelfBooks[g - 1].callNo} 뒤)`;
          else label = `${g + 1}번 (${shelfBooks[g - 1].text} ~ ${shelfBooks[g].text} 사이)`;
          choices.push({ id: `gap_${g}`, emoji: '📥', label, isCorrect: g === insertIndex });
        }
        return choices;
      }

      // label / circulation: 단계들 중 4개 보기 구성
      const others = task.steps.filter((s) => s.target !== nextStep.target).sort(() => Math.random() - 0.5);
      const picks = [nextStep, ...others.slice(0, 3)].sort(() => Math.random() - 0.5);
      return picks.map((s) => ({
        id: s.target,
        emoji: s.emoji,
        label: getStepDisplay(s).label,
        isCorrect: s.target === nextStep.target
      }));
    }

    function buildLabelPracticumChoices(book) {
      const wrongGroups = [300, 400, 600, 900].filter((g) => g !== book.kdcGroup);
      const wrongKdc1 = `${wrongGroups[0] + 10}.2 ${book.author}`;
      const wrongAuthor = `${book.text} ${book.author === '김12ㄱ' ? '박34ㅎ' : '김12ㄱ'}`;
      const wrongKdc2 = `${wrongGroups[1] + 20}.5 ${book.author}`;
      const arr = [
        { callNo: book.callNo, kdcGroup: book.kdcGroup, ok: true },
        { callNo: wrongKdc1, kdcGroup: wrongGroups[0], ok: false, reason: `『${book.title}』는 '${book.category}' 분야(${Math.floor(book.value)}번대) 책이에요!` },
        { callNo: wrongAuthor, kdcGroup: book.kdcGroup, ok: false, reason: `저자 '${book.authorName}'의 성씨로 시작하는 저자기호(${book.author})를 확인해 보세요!` },
        { callNo: wrongKdc2, kdcGroup: wrongGroups[1], ok: false, reason: `'${book.category}' 분류번호와 맞지 않는 번호예요.` }
      ].sort(() => Math.random() - 0.5);
      return arr;
    }

    function recordMistake(msg) {
      if (!state.craft.mistakes.includes(msg)) state.craft.mistakes.push(msg);
    }

    function completeCurrentTask(evalRes = null) {
      state.busy = false;
      state.awaitingNextChoice = false;
      state.awaitingLabelPick = false;
      state.completedCount += 1;
      saveScoreCount(state.completedCount);
      sndSuccess();

      const task = getCurrentTask();
      if (window.D1Bridge && typeof window.D1Bridge.saveRecord === 'function') {
        const starTxt = evalRes ? `별 ${evalRes.stars}/3` : '완료';
        window.D1Bridge.saveRecord({
          game: 'library',
          stage: task.name,
          score: evalRes ? evalRes.stars * 100 : 100,
          summary: `${task.name} (${state.practiceMode} · ${starTxt} · 누적 ${state.completedCount}회)`,
          mode: state.practiceMode,
          payload: { taskId: state.taskId, mode: state.practiceMode, evalRes }
        });
      }

      document.getElementById('completeEmoji').textContent = task.emoji;
      const reportEl = document.getElementById('practicumReport');
      if (evalRes) {
        const starStr = '⭐'.repeat(evalRes.stars) + '☆'.repeat(3 - evalRes.stars);
        document.getElementById('completeTitle').textContent =
          evalRes.stars === 3 ? `${task.name} 완벽 성공!` : `${task.name} 실습 결과`;
        document.getElementById('completeDesc').textContent =
          evalRes.stars === 3
            ? '실수 없이 도서관 규칙에 맞춰 정확하게 완료했어요!'
            : '실수한 부분을 확인하고 한 번 더 연습해 볼까요?';
        reportEl.classList.remove('hidden');
        reportEl.innerHTML =
          `<div class="prac-stars">${starStr}</div>` +
          evalRes.checks.map((c) => `<div class="prac-item ${c.ok ? 'ok' : 'warn'}">${c.ok ? '✅' : '⚠️'} ${c.text}</div>`).join('');
      } else {
        document.getElementById('completeTitle').textContent = `${task.name} 완료!`;
        document.getElementById('completeDesc').textContent = '차분하게 순서대로 정말 잘 해냈어요.';
        reportEl.classList.add('hidden');
      }
      renderUI();
      document.getElementById('completeModal').classList.remove('hidden');
    }

    function advanceGuidedStep() {
      const task = getCurrentTask();
      state.stepIndex += 1;
      if (state.stepIndex >= task.steps.length) {
        completeCurrentTask(null);
        return;
      }
      if (state.practiceMode === 'manual') {
        state.awaitingNextChoice = true;
        state.manualChoices = buildManualChoicesForStep(state.stepIndex);
      }
      renderUI();
    }

    // ---- 동작 실행기 (3D 탭 & 하단 버튼 공용) ----
    function handleAction(actionId, opts = {}) {
      if (state.busy || state.paused) return;

      if (state.practiceMode === 'practicum') {
        handlePracticumAction(actionId, opts);
        return;
      }

      const step = getCurrentStep();
      if (!step) return;

      // 수동실습: 다음 단계 선택 중일 때
      if (state.practiceMode === 'manual' && state.awaitingNextChoice) {
        const expectedHit = getHighlightedTargetId();
        const isRight = (actionId === expectedHit || actionId === step.target);
        if (isRight) {
          state.awaitingNextChoice = false;
          state.manualChoices = [];
          playTone(784, 0.11, 'sine', 0.05);
          executeGuidedAction(actionId);
        } else {
          sndHint();
          const msg = getMismatchGuidance(actionId, step);
          showGuidance(msg, '🧭', true);
          speakKorean(msg, true);
        }
        return;
      }

      // 자동실습 / 수동실습 실행 단계
      const expectedHit = getHighlightedTargetId();
      if (actionId !== expectedHit && actionId !== step.target) {
        sndHint();
        const msg = getMismatchGuidance(actionId, step);
        showGuidance(msg, '💡', true);
        speakKorean(msg, true);
        return;
      }
      executeGuidedAction(actionId);
    }

    function getMismatchGuidance(actionId, step) {
      if (state.taskId === 'label') {
        if (step.target === 'place_book') return '먼저 왼쪽의 새 책을 작업대 매트 위에 올려놓아야 해요!';
        if (actionId === 'keeper' && !state.roundData.labelDone) return '보호필름(키퍼)은 청구기호 라벨을 붙인 다음에 덧대야 해요!';
        if (actionId === 'to_cart') return '아직 라벨 정리가 끝나지 않아 북트럭에 올릴 수 없어요!';
      }
      if (state.taskId === 'sort') {
        return `지금은 ${state.stepIndex + 1}번 자리예요! 남은 책 중 청구기호 숫자가 가장 작은 책(${step.expectedCallNo})을 찾아볼까요?`;
      }
      if (state.taskId === 'shelve') {
        if (step.target === 'pick_cart') return '먼저 앞쪽 북트럭에서 배가할 책을 집어 들어 주세요!';
        const { targetBook, shelfBooks, insertIndex } = state.roundData;
        const clickedGap = Number(String(actionId).replace('gap_', ''));
        if (!Number.isNaN(clickedGap)) {
          if (clickedGap < insertIndex) {
            const rb = shelfBooks[clickedGap];
            return `『${targetBook.title}』(${targetBook.callNo})는 『${rb.title}』(${rb.callNo})보다 더 큰 번호라 오른쪽으로 가야 해요!`;
          }
          if (clickedGap > insertIndex) {
            const lb = shelfBooks[clickedGap - 1];
            return `『${targetBook.title}』(${targetBook.callNo})는 『${lb.title}』(${lb.callNo})보다 더 작은 번호라 왼쪽으로 가야 해요!`;
          }
        }
      }
      if (state.taskId === 'circulation') {
        if (step.target === 'scan_card') return '도서관에서는 먼저 회원증을 스캔해 이용자를 확인해야 해요!';
        if (step.target === 'scan_return' && actionId === 'put_tray') return '반납 트레이에 놓기 전에 먼저 빨간 반납 도서를 스캐너에 찍어야 해요!';
      }
      return `괜찮아요! 지금은 "${getStepDisplay(step).label}" 차례예요. ${step.prompt}`;
    }

    function executeGuidedAction(actionId) {
      state.busy = true;
      if (state.taskId === 'label') {
        const rd = state.roundData;
        const { stackBook, workBook, barcodePatch, callLabelPatch, keeperPatch } = sceneObjects;
        if (actionId === 'place_book') {
          sndClick();
          stackBook.visible = false;
          workBook.visible = true;
          rd.bookPlaced = true;
        } else if (actionId === 'barcode') {
          sndBeep();
          barcodePatch.visible = true;
          rd.barcodeDone = true;
        } else if (actionId === 'call_label') {
          sndStick();
          callLabelPatch.visible = true;
          rd.labelDone = true;
          rd.pickedLabelCorrect = true;
        } else if (actionId === 'keeper') {
          sndStick();
          keeperPatch.visible = true;
          rd.keeperDone = true;
        } else if (actionId === 'to_cart') {
          sndClick();
          rd.cartDone = true;
          const dest = new THREE.Vector3(0.95, DESK_Y + 0.28, 0.04);
          workBook.position.copy(dest);
          workBook.rotation.set(0, -Math.PI / 2, 0);
          barcodePatch.visible = false;
          callLabelPatch.visible = false;
          keeperPatch.visible = false;
          // 책등에 라벨 부착 버전으로 교체 표시
          const finishedBook = createBookMesh(state.activeBook, { showLabel: true, showBarcode: true, scale: 1.24 });
          finishedBook.position.copy(dest);
          finishedBook.rotation.set(0, -Math.PI / 2, 0);
          workBook.visible = false;
          taskGroup.add(finishedBook);
        }
        setTimeout(() => { state.busy = false; advanceGuidedStep(); }, 380);
        return;
      }

      if (state.taskId === 'sort') {
        const rd = state.roundData;
        const idx = Number(actionId.replace('sort_book_', ''));
        const tb = rd.trayBooks[idx];
        const slot = rd.slots[rd.nextSlot];
        sndStick();
        tb.placedSlot = rd.nextSlot;
        rd.nextSlot += 1;
        state.activeBook = rd.sorted[Math.min(rd.nextSlot, rd.sorted.length - 1)];
        tweenTransform(tb.mesh, new THREE.Vector3(slot.x, DESK_Y + 0.21, -0.26), new THREE.Euler(0, -Math.PI / 2, 0), 340, () => {
          state.busy = false;
          advanceGuidedStep();
        });
        return;
      }

      if (state.taskId === 'shelve') {
        const rd = state.roundData;
        if (actionId === 'pick_cart') {
          sndClick();
          rd.holdingBook = true;
          rd.gapMeshes.forEach((gm) => { gm.visible = true; });
          tweenTransform(sceneObjects.cartBook, new THREE.Vector3(0, DESK_Y + 0.50, 0.14), new THREE.Euler(0, -Math.PI / 2, 0), 340, () => {
            state.busy = false;
            advanceGuidedStep();
          });
          return;
        }
        if (actionId.startsWith('gap_')) {
          sndStick();
          const gx = rd.slotX(rd.insertIndex * 2);
          rd.gapMeshes.forEach((gm) => { gm.visible = false; });
          rd.shelved = true;
          tweenTransform(sceneObjects.cartBook, new THREE.Vector3(gx, DESK_Y + 0.235, -0.24), new THREE.Euler(0, -Math.PI / 2, 0), 380, () => {
            state.busy = false;
            advanceGuidedStep();
          });
          return;
        }
      }

      if (state.taskId === 'circulation') {
        const rd = state.roundData;
        const { cardMesh, outBook, retBook } = sceneObjects;
        if (actionId === 'scan_card') {
          sndBeep();
          rd.cardScanned = true;
          tweenTransform(cardMesh, new THREE.Vector3(-0.18, DESK_Y + 0.16, 0.0), new THREE.Euler(0, 0, 0), 260, () => {
            tweenTransform(cardMesh, new THREE.Vector3(-0.78, DESK_Y + 0.015, 0.16), new THREE.Euler(0, 0, 0), 240, () => {
              state.busy = false;
              advanceGuidedStep();
            });
          });
          return;
        }
        if (actionId === 'scan_checkout') {
          sndBeep();
          rd.checkoutScanned = true;
          state.activeBook = rd.bRet;
          tweenTransform(outBook, new THREE.Vector3(-0.18, DESK_Y + 0.15, -0.02), new THREE.Euler(-Math.PI / 2, 0, -Math.PI / 2), 260, () => {
            tweenTransform(outBook, new THREE.Vector3(-0.56, DESK_Y + 0.06, -0.18), new THREE.Euler(-Math.PI / 2, 0, -Math.PI / 2), 260, () => {
              state.busy = false;
              advanceGuidedStep();
            });
          });
          return;
        }
        if (actionId === 'scan_return') {
          sndBeep();
          rd.returnScanned = true;
          tweenTransform(retBook, new THREE.Vector3(-0.18, DESK_Y + 0.15, -0.02), new THREE.Euler(-Math.PI / 2, 0, -Math.PI / 2), 280, () => {
            state.busy = false;
            advanceGuidedStep();
          });
          return;
        }
        if (actionId === 'put_tray') {
          sndStick();
          rd.trayPlaced = true;
          tweenTransform(retBook, new THREE.Vector3(0.92, DESK_Y + 0.09, 0.04), new THREE.Euler(-Math.PI / 2, 0, -Math.PI / 2), 340, () => {
            state.busy = false;
            advanceGuidedStep();
          });
          return;
        }
      }
      state.busy = false;
    }

    // ---- 실습모드(practicum): 자유 조작 + 실수 기록 + 최종 평가 ----
    function handlePracticumAction(actionId, opts = {}) {
      if (state.taskId === 'label') {
        const rd = state.roundData;
        const { stackBook, workBook, barcodePatch, callLabelPatch, keeperPatch } = sceneObjects;
        if (actionId === 'place_book') {
          if (rd.bookPlaced) return;
          sndClick();
          stackBook.visible = false;
          workBook.visible = true;
          rd.bookPlaced = true;
          state.craft.log.push('book_placed');
          showGuidance('작업대에 새 책을 놓았어요! 이제 바코드와 청구기호 라벨을 붙여 보세요.', '📖', false);
          renderUI();
          return;
        }
        if (!rd.bookPlaced) {
          sndHint();
          recordMistake('책을 작업대에 올려놓기 전에 도구를 먼저 눌렀어요');
          showGuidance('앗! 아직 작업대에 책이 없어요. 먼저 왼쪽의 새 책을 작업대에 놓아주세요!', '⚠️', false, true);
          renderUI();
          return;
        }
        if (actionId === 'barcode') {
          if (rd.barcodeDone) return;
          sndBeep();
          barcodePatch.visible = true;
          rd.barcodeDone = true;
          state.craft.log.push('barcode');
          showGuidance('도서관 바코드(등록번호)를 붙였어요!', '🔍', false);
          renderUI();
          return;
        }
        if (actionId === 'call_label') {
          if (rd.labelDone) return;
          sndClick();
          state.awaitingLabelPick = true;
          state.labelChoices = buildLabelPracticumChoices(state.activeBook);
          showGuidance(`『${state.activeBook.title}』(${state.activeBook.authorName})에 맞는 청구기호 라벨을 아래에서 골라주세요!`, '🏷️', false);
          renderUI();
          return;
        }
        if (actionId === 'label_choice') {
          const picked = state.labelChoices[opts.idx];
          if (!picked) return;
          if (!picked.ok) {
            sndHint();
            recordMistake(`잘못된 청구기호 라벨(${picked.callNo})을 선택했어요`);
            showGuidance(picked.reason, '⚠️', false, true);
            renderUI();
            return;
          }
          sndStick();
          state.awaitingLabelPick = false;
          callLabelPatch.visible = true;
          rd.labelDone = true;
          rd.pickedLabelCorrect = true;
          state.craft.log.push('call_label');
          showGuidance(`정확한 청구기호(${picked.callNo}) 라벨을 책등 아래에 붙였어요!`, '🏷️', false);
          renderUI();
          return;
        }
        if (actionId === 'keeper') {
          if (rd.keeperDone) return;
          if (!rd.labelDone) {
            sndHint();
            recordMistake('청구기호 라벨을 붙이기 전에 보호필름(키퍼)을 먼저 붙이려 했어요');
            showGuidance('보호필름(키퍼)을 먼저 붙이면 청구기호 라벨이 안 붙어요! 먼저 청구기호 라벨을 붙여 주세요.', '⚠️', false, true);
            renderUI();
            return;
          }
          sndStick();
          keeperPatch.visible = true;
          rd.keeperDone = true;
          state.craft.log.push('keeper');
          showGuidance('투명 보호필름(키퍼)을 꼼꼼히 덮었어요!', '✨', false);
          renderUI();
          return;
        }
        if (actionId === 'to_cart') {
          if (!rd.barcodeDone || !rd.labelDone || !rd.keeperDone) {
            sndHint();
            recordMistake('바코드·청구기호 라벨·보호필름 중 빠진 작업이 있는 채 북트럭에 옮기려 했어요');
            showGuidance('아직 빠진 라벨 작업이 있어요! 바코드, 청구기호 라벨, 보호필름을 모두 마친 뒤 북트럭에 올려주세요.', '⚠️', false, true);
            renderUI();
            return;
          }
          sndClick();
          rd.cartDone = true;
          workBook.visible = false;
          barcodePatch.visible = false;
          callLabelPatch.visible = false;
          keeperPatch.visible = false;
          const finishedBook = createBookMesh(state.activeBook, { showLabel: true, showBarcode: true, scale: 1.24 });
          finishedBook.position.set(0.95, DESK_Y + 0.28, 0.04);
          finishedBook.rotation.set(0, -Math.PI / 2, 0);
          taskGroup.add(finishedBook);

          const checks = [
            { ok: rd.barcodeDone, text: '도서관 바코드(등록번호) 부착 완료' },
            { ok: rd.pickedLabelCorrect, text: `정확한 청구기호(${state.activeBook.callNo}) 판별 및 부착` },
            { ok: rd.keeperDone, text: '라벨 보호필름(키퍼) 마감 완료' },
            { ok: state.craft.mistakes.length === 0, text: state.craft.mistakes.length === 0 ? '실수 없이 순서대로 완벽 처리' : `주의 기록 ${state.craft.mistakes.length}건 (${state.craft.mistakes[0]})` }
          ];
          const stars = Math.max(1, 3 - Math.min(2, state.craft.mistakes.length));
          completeCurrentTask({ stars, checks });
          return;
        }
      }

      if (state.taskId === 'sort') {
        const rd = state.roundData;
        // 대기 책 클릭 -> 다음 빈 슬롯으로 이동
        if (actionId.startsWith('sort_book_')) {
          const idx = Number(actionId.replace('sort_book_', ''));
          const tb = rd.trayBooks[idx];
          if (!tb) return;
          if (tb.placedSlot !== -1) {
            // 이미 슬롯에 있으면 원래 자리로 되돌리기 (자유 수정!)
            sndClick();
            rd.slots[tb.placedSlot].placedBookIdx = null;
            tb.placedSlot = -1;
            tweenTransform(tb.mesh, tb.homePos, new THREE.Euler(0, -Math.PI / 2, 0), 260);
            showGuidance(`『${tb.data.title}』을(를) 다시 아래로 내려놓았어요.`, '↩️', false);
            renderUI();
            return;
          }
          const emptySlot = rd.slots.find((s) => s.placedBookIdx === null);
          if (!emptySlot) return;
          sndStick();
          emptySlot.placedBookIdx = idx;
          tb.placedSlot = emptySlot.index;
          state.craft.log.push(tb.data.callNo);
          tweenTransform(tb.mesh, new THREE.Vector3(emptySlot.x, DESK_Y + 0.21, -0.26), new THREE.Euler(0, -Math.PI / 2, 0), 300);
          renderUI();
          return;
        }
        // 슬롯 클릭 시 해당 슬롯 책 되돌리기
        if (actionId.startsWith('slot_')) {
          const sIdx = Number(actionId.replace('slot_', ''));
          const slot = rd.slots[sIdx];
          if (slot && slot.placedBookIdx !== null) {
            const tb = rd.trayBooks[slot.placedBookIdx];
            sndClick();
            slot.placedBookIdx = null;
            tb.placedSlot = -1;
            tweenTransform(tb.mesh, tb.homePos, new THREE.Euler(0, -Math.PI / 2, 0), 260);
            renderUI();
          }
          return;
        }
        // 순서 확인 버튼
        if (actionId === 'verify_sort') {
          const allPlaced = rd.slots.every((s) => s.placedBookIdx !== null);
          if (!allPlaced) {
            sndHint();
            showGuidance('아직 빈 자리가 남아 있어요! 모든 책을 1번~끝번 자리에 놓은 뒤 확인해 주세요.', '⚠️', false, true);
            return;
          }
          const placedBooks = rd.slots.map((s) => rd.trayBooks[s.placedBookIdx].data);
          let wrongIdx = -1;
          for (let i = 0; i < placedBooks.length; i++) {
            if (placedBooks[i].callNo !== rd.sorted[i].callNo) { wrongIdx = i; break; }
          }
          if (wrongIdx !== -1) {
            sndHint();
            const got = placedBooks[wrongIdx];
            recordMistake(`${wrongIdx + 1}번 자리에 놓은 ${got.callNo} 순서가 맞지 않았어요`);
            showGuidance(`${wrongIdx + 1}번 자리(${got.callNo}) 순서가 맞지 않아요! 틀린 위치의 책을 눌러 내려놓고 다시 맞춰 보세요.`, '⚠️', false, true);
            renderUI();
            return;
          }
          const checks = [
            { ok: true, text: `${rd.count}권 청구기호 오름차순 정렬 성공` },
            { ok: state.craft.mistakes.length === 0, text: state.craft.mistakes.length === 0 ? '한 번에 정확한 순서로 배열 완료' : `수정 시도 ${state.craft.mistakes.length}회 후 정확히 완성` }
          ];
          const stars = Math.max(1, 3 - Math.min(2, state.craft.mistakes.length));
          completeCurrentTask({ stars, checks });
          return;
        }
      }

      if (state.taskId === 'shelve') {
        const rd = state.roundData;
        if (actionId === 'pick_cart') {
          if (rd.holdingBook) return;
          sndClick();
          rd.holdingBook = true;
          rd.gapMeshes.forEach((gm) => { gm.visible = true; });
          tweenTransform(sceneObjects.cartBook, new THREE.Vector3(0, DESK_Y + 0.50, 0.14), new THREE.Euler(0, -Math.PI / 2, 0), 300);
          showGuidance(`『${rd.targetBook.title}』(${rd.targetBook.callNo})을(를) 들었어요! 서가의 빈칸 중 알맞은 곳에 꽂아보세요.`, '📚', false);
          renderUI();
          return;
        }
        if (actionId.startsWith('gap_')) {
          if (!rd.holdingBook) {
            sndHint();
            recordMistake('북트럭에서 책을 집기 전에 서가 빈칸을 먼저 눌렀어요');
            showGuidance('먼저 앞쪽 북트럭에 있는 책을 집어 주세요!', '⚠️', false, true);
            renderUI();
            return;
          }
          const g = Number(actionId.replace('gap_', ''));
          if (g !== rd.insertIndex) {
            sndHint();
            const reason = getMismatchGuidance(actionId, getCurrentStep());
            recordMistake(`${g + 1}번 자리 오배가 시도`);
            showGuidance(reason, '⚠️', false, true);
            renderUI();
            return;
          }
          sndStick();
          rd.gapMeshes.forEach((gm) => { gm.visible = false; });
          rd.shelved = true;
          const gx = rd.slotX(rd.insertIndex * 2);
          state.busy = true;
          tweenTransform(sceneObjects.cartBook, new THREE.Vector3(gx, DESK_Y + 0.235, -0.24), new THREE.Euler(0, -Math.PI / 2, 0), 340, () => {
            state.busy = false;
            const checks = [
              { ok: true, text: `도서 『${rd.targetBook.title}』(${rd.targetBook.callNo}) 올바른 위치 배가` },
              { ok: state.craft.mistakes.length === 0, text: state.craft.mistakes.length === 0 ? '비콘 없이 단번에 정확한 서가 위치 찾기 성공' : `오배가 시도 ${state.craft.mistakes.length}회 후 정확히 배가` }
            ];
            const stars = Math.max(1, 3 - Math.min(2, state.craft.mistakes.length));
            completeCurrentTask({ stars, checks });
          });
          return;
        }
      }

      if (state.taskId === 'circulation') {
        const rd = state.roundData;
        const { cardMesh, outBook, retBook } = sceneObjects;
        if (actionId === 'scan_card') {
          if (rd.cardScanned) return;
          sndBeep();
          rd.cardScanned = true;
          state.busy = true;
          tweenTransform(cardMesh, new THREE.Vector3(-0.18, DESK_Y + 0.16, 0.0), new THREE.Euler(0, 0, 0), 220, () => {
            tweenTransform(cardMesh, new THREE.Vector3(-0.78, DESK_Y + 0.015, 0.16), new THREE.Euler(0, 0, 0), 220, () => {
              state.busy = false;
              showGuidance('회원증 확인 완료! 이제 대출·반납 도서를 스캔해 보세요.', '💳', false);
              renderUI();
            });
          });
          return;
        }
        if (!rd.cardScanned) {
          sndHint();
          recordMistake('회원증 확인 없이 도서부터 처리하려 했어요');
          showGuidance('먼저 이용자 회원증을 바코드 스캐너에 찍어 본인 확인을 해주세요!', '⚠️', false, true);
          renderUI();
          return;
        }
        if (actionId === 'scan_checkout') {
          if (rd.checkoutScanned) return;
          sndBeep();
          rd.checkoutScanned = true;
          state.activeBook = rd.bRet;
          state.busy = true;
          tweenTransform(outBook, new THREE.Vector3(-0.18, DESK_Y + 0.15, -0.02), new THREE.Euler(-Math.PI / 2, 0, -Math.PI / 2), 220, () => {
            tweenTransform(outBook, new THREE.Vector3(-0.56, DESK_Y + 0.06, -0.18), new THREE.Euler(-Math.PI / 2, 0, -Math.PI / 2), 220, () => {
              state.busy = false;
              showGuidance(`대출 도서 『${rd.bOut.title}』 스캔 완료!`, '📘', false);
              renderUI();
            });
          });
          return;
        }
        if (actionId === 'scan_return') {
          if (rd.returnScanned) return;
          sndBeep();
          rd.returnScanned = true;
          state.busy = true;
          tweenTransform(retBook, new THREE.Vector3(-0.18, DESK_Y + 0.15, -0.02), new THREE.Euler(-Math.PI / 2, 0, -Math.PI / 2), 240, () => {
            state.busy = false;
            showGuidance(`반납 도서 『${rd.bRet.title}』 스캔 완료! 이제 반납 트레이에 놓아주세요.`, '📕', false);
            renderUI();
          });
          return;
        }
        if (actionId === 'put_tray') {
          if (!rd.returnScanned) {
            sndHint();
            recordMistake('반납 도서 바코드를 스캔하지 않고 반납 트레이에 놓으려 했어요');
            showGuidance('반납 도서를 바코드 스캐너에 먼저 찍어야 반납 처리가 돼요!', '⚠️', false, true);
            renderUI();
            return;
          }
          if (!rd.checkoutScanned) {
            sndHint();
            recordMistake('대출 도서 처리를 건너뛰었어요');
            showGuidance('파란색 대출 도서도 바코드 스캐너에 찍어 대출 처리를 마쳐주세요!', '⚠️', false, true);
            renderUI();
            return;
          }
          sndStick();
          rd.trayPlaced = true;
          state.busy = true;
          tweenTransform(retBook, new THREE.Vector3(0.92, DESK_Y + 0.09, 0.04), new THREE.Euler(-Math.PI / 2, 0, -Math.PI / 2), 300, () => {
            state.busy = false;
            const checks = [
              { ok: rd.cardScanned, text: '이용자 회원증 선확인 완료' },
              { ok: rd.checkoutScanned, text: `대출 도서 『${rd.bOut.title}』 스캔 완료` },
              { ok: rd.returnScanned && rd.trayPlaced, text: `반납 도서 『${rd.bRet.title}』 스캔 및 트레이 정리` },
              { ok: state.craft.mistakes.length === 0, text: state.craft.mistakes.length === 0 ? '절차 오류 없이 깔끔한 데스크 응대' : `절차 주의 ${state.craft.mistakes.length}건` }
            ];
            const stars = Math.max(1, 3 - Math.min(2, state.craft.mistakes.length));
            completeCurrentTask({ stars, checks });
          });
        }
      }
    }

    // =========================================================================
    // 8. UI 렌더링
    // =========================================================================
    function renderTaskDrawer() {
      const drawer = document.getElementById('taskDrawer');
      drawer.innerHTML =
        `<div class="task-drawer-title">📚 실습할 도서관 직무 작업을 선택하세요</div>` +
        `<div class="task-grid">` +
          TASK_ORDER.map((id) => {
            const t = TASKS[id];
            return `<button type="button" class="task-card-btn ${id === state.taskId ? 'active' : ''}" data-task="${id}">
              <strong>${t.emoji} ${t.name}</strong>
              <small>${t.desc}</small>
            </button>`;
          }).join('') +
        `</div>`;
      drawer.querySelectorAll('.task-card-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.taskId = btn.dataset.task;
          drawer.classList.add('hidden');
          document.getElementById('taskPickerBtn').setAttribute('aria-expanded', 'false');
          resetTaskSession();
        });
      });
    }

    function renderManualChoiceBar() {
      const bar = document.getElementById('manualChoiceBar');
      // 실습모드 라벨 고르기 팝업
      if (state.practiceMode === 'practicum' && state.awaitingLabelPick) {
        const b = state.activeBook;
        bar.classList.remove('hidden');
        bar.innerHTML =
          `<div class="manual-choice-title">🏷️ 『${b.title}』 (저자: ${b.authorName} · 분야: ${b.category})에 맞는 청구기호 라벨을 고르세요!</div>` +
          `<div class="manual-choice-grid">` +
            state.labelChoices.map((c, idx) =>
              `<button type="button" class="manual-choice-btn" data-lidx="${idx}">` +
                `<span style="display:inline-block;width:10px;height:16px;border-radius:3px;background:${kdcBandColor(c.kdcGroup)}"></span>` +
                `<span>${c.callNo}</span>` +
              `</button>`
            ).join('') +
          `</div>`;
        bar.querySelectorAll('[data-lidx]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const idx = Number(btn.dataset.lidx);
            const ch = state.labelChoices[idx];
            if (ch && !ch.ok) {
              btn.classList.remove('wrong-shake'); void btn.offsetWidth; btn.classList.add('wrong-shake');
            }
            handlePracticumAction('label_choice', { idx });
          });
        });
        return;
      }

      // 수동실습: 다음 단계 선택
      if (state.practiceMode === 'manual' && state.awaitingNextChoice && state.manualChoices.length) {
        const prevStep = getCurrentTask().steps[state.stepIndex - 1];
        bar.classList.remove('hidden');
        bar.innerHTML =
          `<div class="manual-choice-title">🧭 ${prevStep ? `"${getStepDisplay(prevStep).label}" 완료! ` : ''}다음에 할 작업은 무엇일까요?</div>` +
          `<div class="manual-choice-grid">` +
            state.manualChoices.map((ch) =>
              `<button type="button" class="manual-choice-btn" data-choice="${ch.id}"><span>${ch.emoji}</span><span>${ch.label}</span></button>`
            ).join('') +
          `</div>`;
        bar.querySelectorAll('[data-choice]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const expectedHit = getHighlightedTargetId();
            const step = getCurrentStep();
            if (step && btn.dataset.choice !== expectedHit && btn.dataset.choice !== step.target) {
              btn.classList.remove('wrong-shake'); void btn.offsetWidth; btn.classList.add('wrong-shake');
            }
            handleAction(btn.dataset.choice);
          });
        });
        return;
      }

      bar.classList.add('hidden');
    }

    function renderPracticumStatus() {
      const bar = document.getElementById('practicumStatusBar');
      if (state.practiceMode !== 'practicum') { bar.classList.add('hidden'); return; }
      bar.classList.remove('hidden');
      const rd = state.roundData;
      let pills = '';
      if (state.taskId === 'label') {
        pills =
          `<span class="prac-pill">📖 책: ${rd.bookPlaced ? '놓음✓' : '대기'}</span>` +
          `<span class="prac-pill">🔍 바코드: ${rd.barcodeDone ? '완료✓' : '미완료'}</span>` +
          `<span class="prac-pill">🏷️ 청구기호: ${rd.labelDone ? '완료✓' : '미완료'}</span>` +
          `<span class="prac-pill">✨ 보호필름: ${rd.keeperDone ? '완료✓' : '미완료'}</span>`;
      } else if (state.taskId === 'sort') {
        const placed = rd.slots.filter((s) => s.placedBookIdx !== null).length;
        pills = `<span class="prac-pill">🔢 배치: ${placed} / ${rd.count}권</span>` +
                `<span class="prac-pill">💡 놓인 책을 누르면 되돌릴 수 있어요</span>`;
      } else if (state.taskId === 'shelve') {
        pills = `<span class="prac-pill">🛒 책 들기: ${rd.holdingBook ? '들었음✓' : '아직'}</span>` +
                `<span class="prac-pill">📚 서가 배가: ${rd.shelved ? '완료✓' : '자리 선택'}</span>`;
      } else if (state.taskId === 'circulation') {
        pills =
          `<span class="prac-pill">💳 회원증: ${rd.cardScanned ? '확인✓' : '대기'}</span>` +
          `<span class="prac-pill">📘 대출: ${rd.checkoutScanned ? '완료✓' : '대기'}</span>` +
          `<span class="prac-pill">📕 반납: ${rd.returnScanned ? '스캔✓' : '대기'}</span>`;
      }

      bar.innerHTML =
        pills +
        (state.craft.mistakes.length ? `<span class="prac-pill warn">⚠️ 주의 ${state.craft.mistakes.length}건</span>` : '') +
        `<button type="button" class="prac-reset-btn" id="pracRestartBtn">🧹 처음부터 다시</button>`;
      const rbtn = document.getElementById('pracRestartBtn');
      if (rbtn) rbtn.addEventListener('click', resetTaskSession);
    }

    function renderActionBar() {
      const bar = document.getElementById('actionBar');
      bar.innerHTML = '';
      const isAuto = state.practiceMode === 'auto';
      const isManual = state.practiceMode === 'manual';
      const isPracticum = state.practiceMode === 'practicum';
      const showGuide = isAuto || (isManual && !state.awaitingNextChoice);
      const step = getCurrentStep();
      const highlightedId = (showGuide && state.guidedMode) ? getHighlightedTargetId() : null;

      let buttons = [];
      if (state.taskId === 'label') {
        const rd = state.roundData;
        buttons = [
          { id: 'place_book', emoji: '📖', label: '책 놓기', done: rd.bookPlaced },
          { id: 'barcode', emoji: '🔍', label: '바코드 붙이기', done: rd.barcodeDone },
          { id: 'call_label', emoji: '🏷️', label: '청구기호 라벨', done: rd.labelDone },
          { id: 'keeper', emoji: '✨', label: '보호필름(키퍼)', done: rd.keeperDone },
          { id: 'to_cart', emoji: '🛒', label: '북트럭에 옮기기', done: rd.cartDone }
        ];
      } else if (state.taskId === 'sort') {
        const rd = state.roundData;
        buttons = rd.trayBooks.map((tb) => ({
          id: `sort_book_${tb.idx}`,
          emoji: tb.placedSlot !== -1 ? '✅' : '📘',
          label: `${tb.data.callNo} (${tb.data.title.slice(0, 6)})`,
          done: tb.placedSlot !== -1
        }));
        if (isPracticum) {
          const allPlaced = rd.slots.every((s) => s.placedBookIdx !== null);
          buttons.push({ id: 'verify_sort', emoji: '✅', label: '정렬 순서 확인하기', highlightOverride: allPlaced });
        }
      } else if (state.taskId === 'shelve') {
        const rd = state.roundData;
        buttons = [{ id: 'pick_cart', emoji: '🛒', label: '북트럭 책 집기', done: rd.holdingBook }];
        if (rd.holdingBook || isPracticum) {
          for (let g = 0; g <= rd.shelfBooks.length; g++) {
            const lb = g > 0 ? rd.shelfBooks[g - 1] : null;
            const rb = g < rd.shelfBooks.length ? rd.shelfBooks[g] : null;
            const hintTxt = !lb ? `${g + 1}번(맨앞)` : (!rb ? `${g + 1}번(맨뒤)` : `${g + 1}번(${lb.text}~${rb.text})`);
            buttons.push({ id: `gap_${g}`, emoji: '📥', label: hintTxt, done: false });
          }
        }
      } else if (state.taskId === 'circulation') {
        const rd = state.roundData;
        buttons = [
          { id: 'scan_card', emoji: '💳', label: '회원증 스캔', done: rd.cardScanned },
          { id: 'scan_checkout', emoji: '📘', label: '대출 도서 스캔', done: rd.checkoutScanned },
          { id: 'scan_return', emoji: '📕', label: '반납 도서 스캔', done: rd.returnScanned },
          { id: 'put_tray', emoji: '📥', label: '반납 트레이 정리', done: rd.trayPlaced }
        ];
      }

      let hlEl = null;
      buttons.forEach((b) => {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'tool-btn';
        if (b.done && !(isPracticum && state.taskId === 'sort')) el.classList.add('done-btn');
        if (b.highlightOverride || (highlightedId && (highlightedId === b.id || (step && step.target === b.id)))) {
          el.classList.add('highlighted');
          hlEl = el;
        }
        el.innerHTML = `<span>${b.emoji}</span><span>${b.label}</span>`;
        el.addEventListener('click', () => handleAction(b.id));
        bar.appendChild(el);
      });
      if (hlEl) hlEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }

    function renderUI() {
      const task = getCurrentTask();
      const step = getCurrentStep();
      const nextStep = task.steps[state.stepIndex + 1] || null;
      const isAuto = state.practiceMode === 'auto';
      const isManual = state.practiceMode === 'manual';
      const isPracticum = state.practiceMode === 'practicum';
      const showGuide = isAuto || (isManual && !state.awaitingNextChoice);

      document.getElementById('scoreBadge').textContent = `★ ${state.completedCount}`;
      document.getElementById('currentTaskLabel').textContent = `${task.emoji} ${task.name}`;
      document.querySelectorAll('.pmode-btn').forEach((b) => {
        b.classList.toggle('active', b.dataset.pmode === state.practiceMode);
      });

      // 과제 분석표
      const strip = document.getElementById('scheduleStrip');
      strip.innerHTML = '';
      if (isPracticum) {
        strip.innerHTML = `<div class="step-card current"><span class="step-num">🧪</span><span>실전 실습: ${task.emoji} ${task.name} · 안내 없이 직접 순서와 청구기호를 판단해 보세요!</span></div>`;
      } else {
        let curCard = null;
        task.steps.forEach((s, idx) => {
          const disp = getStepDisplay(s);
          const card = document.createElement('div');
          card.className = 'step-card';
          if (idx < state.stepIndex) card.classList.add('done');
          else if (idx === state.stepIndex && !state.awaitingNextChoice) { card.classList.add('current'); curCard = card; }
          const lbl = (isManual && idx > state.stepIndex) ? '❓ 다음 단계' : `${s.emoji} ${disp.label}`;
          card.innerHTML = `<span class="step-num">${idx < state.stepIndex ? '✓' : idx + 1}</span><span>${lbl}</span>`;
          strip.appendChild(card);
          if (idx < task.steps.length - 1) {
            const ar = document.createElement('span');
            ar.className = 'step-arrow'; ar.textContent = '→';
            strip.appendChild(ar);
          }
        });
        if (curCard) curCard.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }

      // 지금 -> 다음 바
      const ftBar = document.getElementById('firstThenBar');
      if (isPracticum) {
        ftBar.innerHTML =
          `<span class="ft-pill now">🧪 자유 실습: ${task.emoji} ${task.name}</span>` +
          `<span>→</span>` +
          `<span class="ft-pill next">3D 작업대나 아래 버튼을 눌러 진행해요</span>`;
      } else if (isManual && state.awaitingNextChoice) {
        ftBar.innerHTML =
          `<span class="ft-pill now">🧭 방금 단계 완료!</span>` +
          `<span>→</span>` +
          `<span class="ft-pill next">아래에서 다음 순서를 직접 골라요</span>`;
      } else if (step) {
        const curDisp = getStepDisplay(step);
        const nextDisp = nextStep ? getStepDisplay(nextStep) : null;
        ftBar.innerHTML =
          `<span class="ft-pill now">지금: ${step.emoji} ${curDisp.label}</span>` +
          `<span>→</span>` +
          `<span class="ft-pill next">${isManual ? '다음: 직접 선택 🧭' : `다음: ${nextStep ? `${nextStep.emoji} ${nextDisp.label}` : '🎉 실습 완료!'}`}</span>`;
      }

      updateBookInfoChip();

      // 안내 배너
      if (isPracticum) {
        if (state.craft.log.length === 0 && !state.awaitingLabelPick && state.craft.mistakes.length === 0) {
          showGuidance(`실습모드예요! "${task.name}" 작업을 스스로 순서에 맞게 해보세요.`, '🧪', false);
        }
      } else if (isManual && state.awaitingNextChoice) {
        showGuidance('방금 단계를 잘 마쳤어요! 아래 보기나 3D 화면에서 다음 순서를 골라보세요.', '🧭', false);
      } else if (step) {
        const disp = getStepDisplay(step);
        showGuidance(disp.prompt, step.emoji, false);
        if (state.guidedMode) speakKorean(disp.prompt);
      }

      renderActionBar();
      renderManualChoiceBar();
      renderPracticumStatus();

      // 3D 강조 링 & 비콘 업데이트
      const hlTarget = getHighlightedTargetId();
      if (showGuide && state.guidedMode && hlTarget && targetAnchors[hlTarget]) {
        const p = targetAnchors[hlTarget];
        highlightRing.position.set(p.x, p.y + 0.015, p.z);
        highlightRing.visible = true;
        highlightBeacon.userData.baseY = p.y + 0.36;
        highlightBeacon.position.set(p.x, p.y + 0.36, p.z);
        highlightBeacon.visible = true;
      } else {
        highlightRing.visible = false;
        highlightBeacon.visible = false;
      }

      // 자동 카메라 포커스
      if (state.autoCamera && state.cameraViewMode === 'step' && !state.awaitingLabelPick) {
        const camKey = (isPracticum || (isManual && state.awaitingNextChoice))
          ? 'overview'
          : (hlTarget && cameraPresets[hlTarget] ? hlTarget : (step && cameraPresets[step.target] ? step.target : 'overview'));
        const preset = cameraPresets[camKey] || cameraPresets.overview;
        animateCameraTo(preset.pos, preset.target, 480);
      }
    }

    function resetTaskSession() {
      state.stepIndex = 0;
      state.busy = false;
      state.awaitingNextChoice = false;
      state.manualChoices = [];
      state.awaitingLabelPick = false;
      state.labelChoices = [];
      state.craft = { mistakes: [], log: [] };
      document.getElementById('completeModal').classList.add('hidden');
      clearTaskScene();
      if (state.taskId === 'label') buildLabelScene();
      else if (state.taskId === 'sort') buildSortScene();
      else if (state.taskId === 'shelve') buildShelveScene();
      else buildCirculationScene();
      renderTaskDrawer();
      renderUI();
      if (state.cameraViewMode === 'overview') {
        const ov = cameraPresets.overview;
        animateCameraTo(ov.pos, ov.target, 420);
      }
    }

    function setPracticeMode(nextMode) {
      if (!nextMode || state.practiceMode === nextMode) return;
      state.practiceMode = nextMode;
      const msg = {
        auto: '자동실습 모드예요. 단계마다 3D 화살표와 버튼으로 차근차근 안내해 드려요.',
        manual: '수동실습 모드예요. 한 단계를 마칠 때마다 다음 순서를 직접 골라 보세요!',
        practicum: '실습모드예요. 안내 없이 직접 판단해 작업하고 결과를 확인해 보세요!'
      }[nextMode];
      resetTaskSession();
      showGuidance(msg, nextMode === 'auto' ? '🤖' : (nextMode === 'manual' ? '🧭' : '🧪'), false);
      speakKorean(msg, true);
    }

    // =========================================================================
    // 9. 마우스 / 태블릿 터치 포인터 & UI 이벤트 바인딩
    // =========================================================================
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const hoverLabel = document.getElementById('hoverLabel');
    let downPos = { x: 0, y: 0 };

    renderer.domElement.addEventListener('pointerdown', (e) => {
      downPos = { x: e.clientX, y: e.clientY };
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      const dist = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
      if (dist > 10) return; // 태블릿 드래그 회전과 탭 구분
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const visibleObjs = interactables.filter((o) => o.visible);
      const hits = raycaster.intersectObjects(visibleObjs, true);
      if (hits.length > 0 && hits[0].object.userData.targetId) {
        handleAction(hits[0].object.userData.targetId, { from3D: true });
      }
    });

    renderer.domElement.addEventListener('pointermove', (e) => {
      if (e.pointerType === 'touch') return;
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const visibleObjs = interactables.filter((o) => o.visible);
      const hits = raycaster.intersectObjects(visibleObjs, true);
      if (hits.length > 0 && hits[0].object.userData.label) {
        hoverLabel.textContent = hits[0].object.userData.label;
        hoverLabel.style.left = `${e.clientX - rect.left}px`;
        hoverLabel.style.top = `${e.clientY - rect.top}px`;
        hoverLabel.classList.remove('hidden');
        container.style.cursor = 'pointer';
      } else {
        hoverLabel.classList.add('hidden');
        container.style.cursor = 'grab';
      }
    });

    // 상단 버튼들
    const taskPickerBtn = document.getElementById('taskPickerBtn');
    const taskDrawer = document.getElementById('taskDrawer');
    const settingsToggleBtn = document.getElementById('settingsToggleBtn');
    const settingsPopover = document.getElementById('settingsPopover');

    taskPickerBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const hidden = taskDrawer.classList.toggle('hidden');
      taskPickerBtn.setAttribute('aria-expanded', String(!hidden));
      if (!hidden) {
        settingsPopover.classList.add('hidden');
        settingsToggleBtn.setAttribute('aria-expanded', 'false');
      }
    });

    settingsToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const hidden = settingsPopover.classList.toggle('hidden');
      settingsToggleBtn.setAttribute('aria-expanded', String(!hidden));
      if (!hidden) {
        taskDrawer.classList.add('hidden');
        taskPickerBtn.setAttribute('aria-expanded', 'false');
      }
    });

    document.addEventListener('pointerdown', (e) => {
      if (!taskDrawer.contains(e.target) && !taskPickerBtn.contains(e.target)) {
        taskDrawer.classList.add('hidden');
        taskPickerBtn.setAttribute('aria-expanded', 'false');
      }
      if (!settingsPopover.contains(e.target) && !settingsToggleBtn.contains(e.target)) {
        settingsPopover.classList.add('hidden');
        settingsToggleBtn.setAttribute('aria-expanded', 'false');
      }
    });

    document.querySelectorAll('.pmode-btn').forEach((btn) => {
      btn.addEventListener('click', () => { sndClick(); setPracticeMode(btn.dataset.pmode); });
    });

    const focusStepBtn = document.getElementById('focusStepBtn');
    const resetCamBtn = document.getElementById('resetCamBtn');
    function syncCamButtons() {
      focusStepBtn.classList.toggle('active', state.cameraViewMode === 'step');
      resetCamBtn.classList.toggle('active', state.cameraViewMode === 'overview');
    }
    focusStepBtn.addEventListener('click', () => {
      state.cameraViewMode = 'step';
      syncCamButtons();
      renderUI();
    });
    resetCamBtn.addEventListener('click', () => {
      state.cameraViewMode = 'overview';
      syncCamButtons();
      animateCameraTo(cameraPresets.overview.pos, cameraPresets.overview.target, 460);
    });

    const fullscreenBtn = document.getElementById('fullscreenBtn');
    if (window.D1Bridge && typeof window.D1Bridge.bindFullscreenButton === 'function') {
      window.D1Bridge.bindFullscreenButton(fullscreenBtn, { enterText: '⛶ 전체화면', exitText: '⛶ 창모드' });
    } else {
      fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
        else document.exitFullscreen?.();
      });
    }

    document.getElementById('quickBreakBtn').addEventListener('click', () => {
      state.paused = true;
      document.getElementById('breakModal').classList.remove('hidden');
    });
    document.getElementById('resumeBreakBtn').addEventListener('click', () => {
      state.paused = false;
      document.getElementById('breakModal').classList.add('hidden');
    });

    document.getElementById('autoCamBtn').addEventListener('click', (e) => {
      state.autoCamera = !state.autoCamera;
      e.target.textContent = `🎬 자동 카메라: ${state.autoCamera ? '켜짐' : '꺼짐'}`;
      e.target.classList.toggle('active', state.autoCamera);
    });
    document.getElementById('modeBtn').addEventListener('click', (e) => {
      state.guidedMode = !state.guidedMode;
      e.target.textContent = `🧭 안내 강조: ${state.guidedMode ? '켜짐' : '꺼짐'}`;
      e.target.classList.toggle('active', state.guidedMode);
      renderUI();
    });
    document.getElementById('voiceBtn').addEventListener('click', (e) => {
      state.voiceEnabled = !state.voiceEnabled;
      e.target.textContent = `🔊 음성 안내: ${state.voiceEnabled ? '켜짐' : '꺼짐'}`;
      e.target.classList.toggle('active', state.voiceEnabled);
      if (state.voiceEnabled) speakKorean(document.getElementById('guidanceText').textContent, true);
    });
    document.getElementById('soundBtn').addEventListener('click', (e) => {
      state.soundEnabled = !state.soundEnabled;
      e.target.textContent = `🔔 효과음: ${state.soundEnabled ? '켜짐' : '꺼짐'}`;
      e.target.classList.toggle('active', state.soundEnabled);
    });
    document.getElementById('easyLibBtn').addEventListener('click', (e) => {
      state.easyMode = !state.easyMode;
      e.target.textContent = `📖 쉬운 말: ${state.easyMode ? '켜짐' : '꺼짐'}`;
      e.target.classList.toggle('active', state.easyMode);
      renderUI();
    });
    const diffNames = { 1: '기초(정수)', 2: '표준(소수+저자)', 3: '심화(5권)' };
    document.getElementById('diffBtn').addEventListener('click', (e) => {
      state.difficulty = (state.difficulty % 3) + 1;
      e.target.textContent = `📊 난이도: ${diffNames[state.difficulty]}`;
      resetTaskSession();
    });

    document.getElementById('speakStepBtn').addEventListener('click', () => {
      speakKorean(document.getElementById('guidanceText').textContent, true);
    });
    document.getElementById('closeGuidanceBtn').addEventListener('click', () => {
      state.guidanceHidden = true;
      document.getElementById('guidanceBanner').classList.add('hidden');
      document.getElementById('reopenGuidanceBtn').classList.remove('hidden');
    });
    document.getElementById('reopenGuidanceBtn').addEventListener('click', () => {
      state.guidanceHidden = false;
      document.getElementById('guidanceBanner').classList.remove('hidden');
      document.getElementById('reopenGuidanceBtn').classList.add('hidden');
    });

    document.getElementById('retryTaskBtn').addEventListener('click', resetTaskSession);
    document.getElementById('nextTaskBtn').addEventListener('click', () => {
      const idx = (TASK_ORDER.indexOf(state.taskId) + 1) % TASK_ORDER.length;
      state.taskId = TASK_ORDER[idx];
      resetTaskSession();
    });

    window.addEventListener('resize', () => {
      const w = container.clientWidth;
      const h = Math.max(container.clientHeight, 1);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    // =========================================================================
    // 10. 렌더 루프 & 시작
    // =========================================================================
    function animate(now) {
      requestAnimationFrame(animate);
      for (let i = animators.length - 1; i >= 0; i--) {
        if (animators[i].update(now)) animators.splice(i, 1);
      }
      if (highlightRing.visible) {
        const s = 1 + Math.sin(now * 0.006) * 0.08;
        highlightRing.scale.set(s, s, 1);
      }
      if (highlightBeacon.visible) {
        highlightBeacon.position.y = highlightBeacon.userData.baseY + Math.sin(now * 0.006) * 0.035;
      }
      controls.update();
      renderer.render(scene, camera);
    }

    resetTaskSession();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
